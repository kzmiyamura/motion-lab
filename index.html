<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MotionLab — Salsa Rhythm Trainer</title>
    <meta name="description" content="High-Precision Dance Training & Motion Analysis" />
    <meta name="theme-color" content="#080814" />

    <!-- 計測用（一時）: ?armDump= 付きのときだけ、非表示タブでも描画ループが止まらない
         よう RAF を MessageChannel へ差し替える。three が RAF を import 時に掴むため、
         モジュール読込より前（ここ）で行う必要がある -->
    <script>
      if (new URLSearchParams(location.search).has('armDump')) {
        (function () {
          var raf = window.requestAnimationFrame.bind(window);
          var q = [];
          var ch = new MessageChannel();
          ch.port1.onmessage = function () {
            var cb = q.shift();
            if (cb) cb(performance.now());
          };
          window.requestAnimationFrame = function (cb) {
            if (document.visibilityState !== 'hidden') return raf(cb);
            q.push(cb);
            ch.port2.postMessage(0);
            return 0;
          };
        })();
      }
    </script>

    <!-- PWA / ホーム画面追加 -->
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <link rel="apple-touch-icon" href="/pwa-icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MotionLab" />

    <!-- OG / SNS -->
    <meta property="og:title" content="MotionLab — Salsa Rhythm Trainer" />
    <meta property="og:description" content="High-Precision Dance Training & Motion Analysis" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
